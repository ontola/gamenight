<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Match Flutter's layout viewport from the first paint on phones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Join your GameNight room, play on your phone and choose what comes next.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GameNight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GameNight</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face{font-family:Bungee;src:url(assets/assets/fonts/Bungee-Regular.ttf) format('truetype');font-display:swap}
    html,body{margin:0;width:100%;height:100%;background:#0d1020;color:#eef0fc;color-scheme:dark}
    #app-loading{position:fixed;inset:0;z-index:10000;display:grid;place-content:center;justify-items:center;gap:22px;background:radial-gradient(ellipse at 50% 35%,#211b40 0,transparent 55%),#0d1020;font:16px system-ui;text-align:center;padding:24px}
    .loading-brand{display:flex;align-items:center;gap:14px;font:clamp(25px,6vw,38px)/1.3 Bungee,system-ui;color:#ffb454}
    .loading-brand span span{color:#a78bfa}.loading-brand img{width:48px;height:48px;animation:logo-bob 1.6s ease-in-out infinite}
    #loading-status{color:#a8adc4;margin:0}.loading-track{height:3px;width:150px;overflow:hidden;border-radius:4px;background:#343b53}
    .loading-track:after{content:'';display:block;height:100%;width:45%;background:#a78bfa;border-radius:4px;animation:loading-slide 1.4s ease-in-out infinite}
    #loading-retry{color:#eef0fc;background:#5143ae;border:1px solid #7565ee;border-radius:10px;padding:12px 24px;font:inherit;cursor:pointer}
    @keyframes logo-bob{50%{transform:translateY(-5px) rotate(-5deg)}}
    @keyframes loading-slide{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
    @media(prefers-reduced-motion:reduce){.loading-brand img,.loading-track:after{animation:none}}
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-brand"><img src="assets/assets/icon.svg" alt=""><span>Game<span>Night</span></span></div>
    <div class="loading-track" aria-hidden="true"></div>
    <p id="loading-status">Getting ready…</p>
    <button id="loading-retry" hidden onclick="location.reload()">Try again</button>
  </div>
  <script>
    (() => {
      const status = document.getElementById('loading-status');
      const retry = document.getElementById('loading-retry');
      const delayed = setTimeout(() => { status.textContent = 'Still loading. Check your connection or try again.'; retry.hidden = false; }, 20000);
      window.addEventListener('flutter-first-frame', () => {
        clearTimeout(delayed); document.getElementById('app-loading')?.remove();
      }, {once: true});
      window.gameNightLoadFailed = () => {
        clearTimeout(delayed); status.textContent = 'GameNight could not load. Please try again.'; retry.hidden = false;
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async onerror="gameNightLoadFailed()"></script>
  <noscript>Enable JavaScript to open GameNight.</noscript>
</body>
</html>
