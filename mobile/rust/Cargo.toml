[package]
name = "gamenight_phone"
version = "0.1.0"
edition = "2021"
description = "The phone's own player store (Atomic Data), for the GameNight app."
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
gamenight-store = { path = "../../crates/gamenight-store" }
gamenight-core = { path = "../../crates/gamenight-core" }
gamenight-protocol = { path = "../../crates/gamenight-protocol" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
