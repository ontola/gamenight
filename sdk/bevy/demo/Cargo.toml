[package]
name = "bevy-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Star Catch: a small Bevy party game showing every GameNight feature."

[dependencies]
gamenight-bevy = { path = ".." }
bevy = { version = "0.20", default-features = false, features = ["2d", "ui", "audio", "wav"] }
serde_json = "1"

[dev-dependencies]
gamenight-certify = { path = "../../../crates/gamenight-certify" }
gamenight-protocol = { path = "../../../crates/gamenight-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
