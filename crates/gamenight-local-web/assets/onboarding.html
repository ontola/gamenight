<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Ready for your game | GameNight</title>
<link rel="stylesheet" href="/web/site.css"><style>body{background:#10111c;color:#f4f3fa;font:18px system-ui;margin:0}main{max-width:560px;margin:15vh auto;padding:24px}h1{font-size:40px;letter-spacing:-1px}p{color:#b6b4ca;line-height:1.6}button{background:#a797ff;border:0;border-radius:12px;padding:14px 20px;font:inherit;color:#171126;cursor:pointer}[hidden]{display:none}</style></head>
<body><main><p>GameNight</p><h1 id="title">Getting your game ready.</h1><p id="status" role="status">Connecting to your lobby…</p><button id="retry" hidden>Try again</button></main>
<script>
const p=new URLSearchParams(location.hash.slice(1)),ticket=p.get('ticket'),game=p.get('game');
history.replaceState(null,'',location.pathname);
async function claim(){
 document.querySelector('#retry').hidden=true;
 try{
  if(!/^[a-f0-9]{32}$/.test(ticket||''))throw Error('Open GameNight to start setup again.');
  const r=await fetch('/api/onboarding',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket,game})});
  if(!r.ok)throw Error(r.status===422?'This game is not available in this version of GameNight. Update the app and try again.':r.status===403||r.status===410?'This setup link has expired. Reopen GameNight to try again.':'Your lobby has not confirmed the game yet. Keep GameNight open and try again.');
  document.querySelector('#title').textContent=game?'Your game is up next.':'Your lobby is ready.';
  document.querySelector('#status').textContent=game?'Return to GameNight. Your game is first in the download queue. The lobby shows its progress. Connect your controller and press Play when it is ready.':'Return to GameNight and connect your controllers.';
 }catch(e){document.querySelector('#status').textContent=e.message;document.querySelector('#retry').hidden=false;}
}
document.querySelector('#retry').onclick=claim;claim();
</script></body></html>
