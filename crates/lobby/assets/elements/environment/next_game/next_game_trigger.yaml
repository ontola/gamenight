# Three landing zones: resume the current game, play next, skip upcoming.
body_size: [240, 14]
screen_size: [240, 76]
screen_offset: [0, -57]
# Original synthesized rising ticks, then confirmation.
hold_sounds:
  - ./hold-0.ogg
  - ./hold-1.ogg
  - ./hold-2.ogg
  - ./hold-3.ogg
  - ./hold-4.ogg
  - ./hold-5.ogg
