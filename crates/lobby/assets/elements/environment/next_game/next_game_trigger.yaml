# Three non-solid floor dwell zones: resume the current game, play next, skip upcoming.
body_size: [360, 4]
screen_size: [360, 76]
screen_offset: [0, 66]
# Original synthesized rising ticks, then confirmation.
hold_sounds:
  - ./hold-0.ogg
  - ./hold-1.ogg
  - ./hold-2.ogg
  - ./hold-3.ogg
  - ./hold-4.ogg
  - ./hold-5.ogg
