# Standalone workspace. This fork is its own git repository and must build
# without caring what the surrounding GameNight workspace lists — its
# exclude entry has gone stale twice now (once on the jumpy -> lobby
# rename, once on a branch that predated it), and each time cargo refused
# to build here at all.
[workspace]

[package]
authors     = ["The Fish Fight Game & Spicy Lobster Developers"]
default-run = "lobby"
description = "A tactical 2D shooter"
edition     = "2021"
license     = "MIT OR Apache-2.0"
name        = "lobby"
version     = "0.12.2"

[features]
default = []
# # Enable to simulate horrible network latency/slowness
# debug-network-slowdown = ["async-timer", "turborand"]
# # Enable bevy tracing scopes in profiling and tracy profiler support.
# profiling-full = ["bevy/trace", "dep:tracing-tracy"]

[dependencies]
bones_framework     = { git = "https://github.com/fishfolk/bones", features = ["net-debug"] }
bones_bevy_renderer = { git = "https://github.com/fishfolk/bones" }
bevy_tasks          = "0.11"
bitflags            = "2.4"
turborand           = { version = "0.10.0", features = ["atomic"] }
tracing             = "0.1.37"
puffin              = { version = "0.17.0", features = ["web"] }
puffin_egui         = "0.23.0"
petgraph            = "0.6.4"
rapier2d = { version = "0.19.0", features = [
    "debug-render",
    "enhanced-determinism",
] }
indexmap = "2.0.0"
serde = { version = "1.0.188", features = ["derive"] }
shiftnanigans = "0.3.3"
humantime-serde = "1.1.1"
ordered-float = "3.9.1"
nalgebra = { version = "0.32", features = ["glam024"] }
once_cell = "1.18.0"
async-channel = "1.9.0"
serde_yaml = "0.9.25"
thiserror = "1.0.48"
peg = "0.8.1"
egui_extras = { version = "0.23.0", default-features = false }
shadow-rs = { version = "0.25.0", default-features = false }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
strum = { version = "0.25.0", features = ["derive"] }
smallvec = "1"
qrcode = "0.14"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bitfield   = "0.14"
bytemuck   = "1.12"

# GameNight party-launcher integration: connects to a resident daemon over a
# background thread and drives session lifecycle. Native-only (the daemon and
# its websocket protocol have no meaning in the wasm web build).
#
# These are sibling checkouts under the same `~/dev` tree; a path dependency
# keeps the integration simple for now (see the GameNight integration report
# for the tradeoffs of vendoring vs. depending on a published crate instead).
gamenight-protocol = { path = "../gamenight-protocol" }
gamenight-sdk      = { path = "../gamenight-sdk" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1.0"
# Only ever transitive before (via bones_bevy_renderer) — named directly so
# gamenight.rs can reach the real winit `Window` to raise/fullscreen it.
bevy = "0.11.3"
bevy_ecs = "0.11.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Bring jumpy to the front (and hand focus back) exactly like GameNight's
# native overlay used to: real NSApp activation, no floating panels.
objc2 = "0.6"
raw-window-handle = "0.5"

