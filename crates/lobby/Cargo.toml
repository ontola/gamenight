# Optimize dependencies even in development
[profile.dev.package."*"]
codegen-units = 1
debug         = 1 # Only keep line numbers
opt-level     = 3

# Optimize our code a little bit.
[profile.dev]
codegen-units = 256
opt-level     = 1

[profile.dev-optimized]
debug     = 1
inherits  = "dev"
opt-level = 3

[profile.release]
codegen-units = 1    # Improved rapier physics perf, so it might help other stuff, too
lto           = true

[build-dependencies]
shadow-rs = "0.25.0"

[package.metadata.cargo-machete]
ignored = [
    "tracing",   # Needed to add `release_max_level_debug` feature
    "getrandom", # Needed to add `js` feature
]

# Vendored Bones snapshot with a raw-asset cache fix; see THIRD_PARTY.md.
[patch.'https://github.com/fishfolk/bones']
bones_framework     = { path = "../../vendor/bones/framework_crates/bones_framework" }
bones_bevy_renderer = { path = "../../vendor/bones/framework_crates/bones_bevy_renderer" }
