[package]
name = "gamenight-daemon"
default-run = "gamenight-daemon"
description = "The GameNight daemon: hosts the party, talks the protocol to games and overlays over WebSockets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gamenight-protocol = { workspace = true }
gamenight-core = { workspace = true }
gamenight-catalog = { path = "../gamenight-catalog" }
gamenight-installer = { path = "../gamenight-installer" }
gamenight-local-web = { path = "../gamenight-local-web" }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Global controller polling so a Back/Select press can start the night from
# the couch even before anything else is running — see `launcher_watch`.
gilrs = "0.10"

# Undoing the screen-steal a process launch causes on macOS — see `macos.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
gamenight-sdk = { workspace = true }

[[bin]]
name = "gamenight-daemon"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
velopack = "=1.2.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_Control", "Win32_System_WinRT"] }
