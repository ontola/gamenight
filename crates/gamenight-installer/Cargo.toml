[package]
name = "gamenight-installer"
description = "Fetches, verifies and extracts the catalogue's free direct-download games in the background — no accounts, no store client, no clicks."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gamenight-catalog = { path = "../gamenight-catalog" }
gamenight-protocol = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
uuid = { workspace = true }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "gamenight-installer"
path = "src/main.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
