[package]
name = "gamenight-store"
description = "The host's own storage for players' settings and progress, on Atomic Data (atomic_lib)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gamenight-core = { workspace = true }
gamenight-protocol = { workspace = true }
atomic_lib = { version = "=0.41.0-beta.8", default-features = false, features = ["db-redb"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
