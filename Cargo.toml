[workspace]
resolver = "2"
# The phone app's Rust library builds with the app (cargokit), and the
# Bevy plugin with its demo in its own workspace (Bevy is big), each on its own.
exclude = ["mobile/rust", "sdk/bevy"]
members = [
    "crates/gamenight-protocol",
    "crates/gamenight-core",
    "crates/gamenight-daemon",
    "crates/gamenight-sdk",
    "crates/gamenight-certify",
    "crates/gamenight-catalog",
    "crates/gamenight-installer",
    "crates/gamenight-mcp",
    "crates/gamenight-local-web",
    "crates/gamenight-store",
    "examples/demo-game",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ontola/gamepad-party"

[workspace.dependencies]
gamenight-protocol = { path = "crates/gamenight-protocol" }
gamenight-core = { path = "crates/gamenight-core" }
gamenight-sdk = { path = "crates/gamenight-sdk" }
gamenight-store = { path = "crates/gamenight-store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-tungstenite = "0.24"
# One TLS backend for the whole host: atomic_lib brings aws-lc-rs, the rest
# ring, and with both compiled in rustls picks neither by itself.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Line tables in the release build: on Windows they go into the .pdb next
# to the exe, which the release keeps, so a crash dump from a player's PC
# shows where it happened. The exe itself stays the same size.
[profile.release]
debug = "line-tables-only"

# Fast native packaging smoke builds; production installers use release.
[profile.ci]
inherits = "dev"
debug = 0
