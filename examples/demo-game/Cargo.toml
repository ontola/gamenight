[package]
name = "demo-game"
description = "A terminal 'game' that joins a GameNight party, plays timed matches and rolls with transitions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gamenight-sdk = { workspace = true }
gamenight-protocol = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
gamenight-daemon = { path = "../../crates/gamenight-daemon" }
gamenight-certify = { path = "../../crates/gamenight-certify" }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "demo-game"
path = "src/main.rs"
