name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned game sources
        run: python scripts/fetch-game-sources.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Test Mineclonia settings and adapter boundaries
        # The pinned ontola/gamenight-mineclonia checkout from game-sources.json.
        working-directory: ${{ github.workspace }}/../gamenight-mineclonia
        run: python -m unittest test_settings test_managed test_mod_lifecycle test_host test_relay test_couch
      - run: python scripts/test-release.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - if: runner.os == 'Windows'
        name: Check hidden game launch and descendant cleanup
        run: python scripts/test-windows-preload.py target/debug/gamenight-daemon.exe
      - if: runner.os == 'Linux'
        name: Test live settings in all shared games
        run: |
          sudo apt-get install -y love
          python3 scripts/test-live-settings.py

      - if: runner.os == 'Linux'
        name: Test first-launch catalog handoff and recovery
        run: python3 scripts/test-onboarding.py
      - if: runner.os != 'Windows'
        run: cargo run -p gamenight-certify -- demo-game -- target/debug/demo-game 1
      - if: runner.os == 'Windows'
        run: cargo run -p gamenight-certify -- demo-game -- target/debug/demo-game.exe 1
      - if: runner.os != 'Windows'
        run: |
          python3 scripts/test-c-transport.py
          cc -std=c99 -Wall -Wextra -Werror -I sdk/c -o /tmp/c-game examples/c-game.c
          cargo run -p gamenight-certify -- c-game -- /tmp/c-game
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - if: runner.os == 'Windows'
        name: Test real Windows install and update
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Velopack installation failed' }
          cargo build --locked -p gamenight-daemon --example installer-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Installer fixture build failed' }
          python scripts/test-windows-installer.py --binary target/debug/examples/installer-smoke.exe --output "$env:RUNNER_TEMP/installer-smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Installer smoke test failed' }
      - if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-diagnostics
          path: |
            ${{ runner.temp }}/installer-smoke/data
            ${{ runner.temp }}/installer-smoke/*.log
          if-no-files-found: ignore
  godot-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: ./.github/actions/setup-godot
        with:
          version: 4.5.2
      - run: cargo build --locked -p gamenight-daemon --bin gamenight-daemon
      - run: python3 scripts/test-godot-sdk.py --godot "$GODOT"
      - run: python3 scripts/test-godot-lobby.py --godot "$GODOT"
      - run: python3 sdk/godot/sync.py --check lobbies/game-room
      - run: python3 scripts/test-game-room.py --godot "$GODOT"
      - run: python3 scripts/test-phone-players.py
      - run: python3 -m pip install websockets && python3 scripts/test-godot-template.py --godot "$GODOT"
      - run: python3 scripts/test-godot-fake-host.py --godot "$GODOT"
      - run: $GODOT --headless --path lobbies/game-room --script res://tests/eligibility.gd -- --demo --scene=stations
      - run: $GODOT --headless --path lobbies/game-room --script res://tests/update.gd -- --demo
      - run: $GODOT --headless --path lobbies/game-room --script res://tests/lobby_switch.gd -- --demo
      - run: $GODOT --headless --path lobbies/game-room --script res://tests/bench.gd -- --demo --scene=phones
      - run: $GODOT --headless --path lobbies/game-room --script res://tests/weapons.gd
      - run: $GODOT --headless --path lobbies/game-room --script res://tests/carry.gd
      - run: $GODOT --headless --path lobbies/game-room --script res://tests/queue.gd -- --demo --scene=stations
      - run: python3 scripts/test-lobby-recovery.py
      - run: python3 scripts/test-host-lobby.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-integration-log
          path: |
            .local/lobby-flow.log
            .local/game-room-flow.log

  shared-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shared browser scripts
        run: for file in web/*.js; do node --check "$file"; done
      - name: Check the generated protocol module and the JavaScript example
        run: node --check sdk/js/protocol.mjs && node --check examples/tiny-game.mjs

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned game sources
        run: python scripts/fetch-game-sources.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -r docs/site/requirements.txt
      - run: python scripts/build-docs.py --check
      - name: Check protocol bindings match contract/protocol.schema.json
        run: python scripts/build-protocol.py --check
      - run: python scripts/test-docs.py
      - run: cargo check --locked -p gamenight-sdk --example docs_lifecycle
      - run: cc -std=c99 -Wall -Wextra -Werror -I sdk/c -o /tmp/docs-c-game examples/c-game.c

  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate-branding.cjs --check

  contract-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-game-contract.py
      - run: python scripts/test-release-catalog.py
      - run: python scripts/game-contract.py --output contract-audit
      - run: cat contract-audit/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: game-contract-linux-inventory
          path: contract-audit/
