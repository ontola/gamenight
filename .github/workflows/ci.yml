name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Test Mineclonia settings and adapter boundaries
        working-directory: examples/mineclonia
        run: python -m unittest test_settings test_managed test_mod_lifecycle test_host test_relay test_couch
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - if: runner.os == 'Linux'
        name: Test first-launch catalog handoff and recovery
        run: python3 scripts/test-onboarding.py
      - if: runner.os != 'Windows'
        run: cargo run -p gamenight-certify -- demo-game -- target/debug/demo-game 1
      - if: runner.os == 'Windows'
        run: cargo run -p gamenight-certify -- demo-game -- target/debug/demo-game.exe 1
      - if: runner.os != 'Windows'
        run: |
          cc -std=c99 -Wall -Wextra -Werror -I sdk/c -o /tmp/c-game examples/c-game.c
          cargo run -p gamenight-certify -- c-game -- /tmp/c-game
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - if: runner.os == 'Windows'
        name: Test real Windows install and update
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Velopack installation failed' }
          cargo build --locked -p gamenight-daemon --example installer-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Installer fixture build failed' }
          python scripts/test-windows-installer.py --binary target/debug/examples/installer-smoke.exe --output "$env:RUNNER_TEMP/installer-smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Installer smoke test failed' }
      - if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-diagnostics
          path: |
            ${{ runner.temp }}/installer-smoke/data
            ${{ runner.temp }}/installer-smoke/*.log
          if-no-files-found: ignore
  lobby:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lobby
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxi-dev libxrandr-dev
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        name: Validate lobby theme assets
        run: |
          python -m pip install Pillow PyYAML
          python crates/lobby/tools/reskin/verify_themes.py
          python crates/lobby/tools/layout_lobby.py --check
          python crates/lobby/tools/test_layout_lobby.py
          python scripts/test-dev-assets.py
      - run: cargo build --manifest-path crates/lobby/Cargo.toml --locked --profile ci

  godot-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Install Godot 4.5.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.2-stable_linux.x86_64
      - run: cargo build --locked -p gamenight-daemon --bin gamenight-daemon
      - run: python3 scripts/test-godot-sdk.py --godot /tmp/godot/Godot_v4.5.2-stable_linux.x86_64
      - run: python3 scripts/test-godot-lobby.py --godot /tmp/godot/Godot_v4.5.2-stable_linux.x86_64
      - run: python3 scripts/test-lobby-recovery.py
      - run: python3 scripts/test-host-lobby.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-integration-log
          path: .local/lobby-flow.log

  shared-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shared browser scripts
        run: for file in web/*.js; do node --check "$file"; done

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -r docs/site/requirements.txt
      - run: python scripts/build-docs.py --check
      - run: python scripts/test-docs.py
      - run: cargo check --locked -p gamenight-sdk --example docs_lifecycle
      - run: cc -std=c99 -Wall -Wextra -Werror -I sdk/c -o /tmp/docs-c-game examples/c-game.c

  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate-branding.cjs --check

  contract-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-game-contract.py
      - run: python scripts/test-release-catalog.py
      - run: python scripts/game-contract.py --output contract-audit
      - run: cat contract-audit/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: game-contract-linux-inventory
          path: contract-audit/
