name: Windows installer
on:
  pull_request:
    paths:
      - '.github/workflows/windows-preview.yml'
      - 'scripts/*windows*'
      - 'crates/gamenight-daemon/**'
      - 'crates/gamenight-host-services/**'
      - 'crates/gamenight-installer/**'
      - 'crates/gamenight-catalog/**'
      - 'catalog/**'
      - 'crates/lobby/**'
      - 'vendor/bones/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
      automatic:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (without v)'
        required: true
        default: '0.1.0-preview.2'
      channel:
        type: choice
        options: [preview, stable]
        default: preview
      publish:
        description: 'Create a draft GitHub release with the installer and update feed'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contract:
    uses: ./.github/workflows/love-party.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
  package:
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        if: inputs.automatic
        with:
          name: gamenight-love-party
          path: dist/release-games
      - name: Prepare the exact release catalog
        if: inputs.automatic
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/prepare-release-catalog.py --pack dist/release-games --version "$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        if: inputs.automatic
        with:
          name: release-catalog
          path: catalog/games/*.json
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/lobby -> target
          key: windows-installer
      - name: Install pinned packaging tool
        run: dotnet tool install --global vpk --version 1.2.0
      - name: Authenticate for signing
        if: (github.event_name == 'workflow_dispatch' || inputs.automatic) && github.ref == 'refs/heads/main' && vars.WINDOWS_SIGNING_ENDPOINT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build installer and update feed
        shell: pwsh
        env:
          AUTOMATIC_RELEASE: ${{ inputs.automatic }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
        run: |
          $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { "0.1.0-ci.$env:GITHUB_RUN_NUMBER" }
          $channel = if ($env:RELEASE_CHANNEL) { $env:RELEASE_CHANNEL } else { 'preview' }
          $buildProfile = if (($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -or $env:AUTOMATIC_RELEASE -eq 'true')) { 'release' } else { 'ci' }
          $params = @{
            Version = $version; Channel = $channel; BuildProfile = $buildProfile
            OutputDir = "$env:RUNNER_TEMP/installer"; TargetDir = "$env:GITHUB_WORKSPACE/target"
          }
          if (($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -or $env:AUTOMATIC_RELEASE -eq 'true') -and $env:GITHUB_REF -eq 'refs/heads/main' -and $env:SIGNING_ENDPOINT) {
            if (!$env:SIGNING_ACCOUNT -or !$env:SIGNING_PROFILE) { throw 'Signing configuration is incomplete' }
            $metadata = "$env:RUNNER_TEMP/signing.json"
            @{ Endpoint=$env:SIGNING_ENDPOINT; CodeSigningAccountName=$env:SIGNING_ACCOUNT; CertificateProfileName=$env:SIGNING_PROFILE } |
              ConvertTo-Json | Set-Content -LiteralPath $metadata -Encoding utf8NoBOM
            $params.SigningMetadata = $metadata
          }
          ./scripts/build-windows-installer.ps1 @params
      - name: Check packaged catalog and install every native download
        shell: pwsh
        run: |
          cargo build --locked -p gamenight-installer
          if ($LASTEXITCODE -ne 0) { throw 'Installer probe build failed' }
          python scripts/check-release-catalog.py --platform windows --packaged-catalog "$env:RUNNER_TEMP/installer/package/gamenight-windows-preview/catalog/games" --installer target/debug/gamenight-installer.exe --output "$env:RUNNER_TEMP/native-downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Native download or packaged catalog check failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-download-evidence
          path: |
            ${{ runner.temp }}/native-downloads/results.json
            ${{ runner.temp }}/native-downloads/installer.log
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-windows-installer
          path: ${{ runner.temp }}/installer/releases/*
          if-no-files-found: error
  release:
    needs: [package, contract]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gamenight-windows-installer
          path: release
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: game-contract-windows
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: gamenight-love-party
          path: games
      - name: Require complete game contract evidence for this release
        run: python source/scripts/game-contract.py --gate --platform windows --output evidence --pack games
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTOMATIC_RELEASE: ${{ inputs.automatic }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          args=(--draft --title "GameNight $RELEASE_VERSION" --target "$GITHUB_SHA" --generate-notes)
          if [ "$RELEASE_CHANNEL" = preview ]; then args+=(--prerelease); fi
          tar -czf release/game-contract-windows.tar.gz -C evidence .
          gh release create "v$RELEASE_VERSION" release/* games/*.love "${args[@]}"
