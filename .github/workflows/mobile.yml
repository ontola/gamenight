name: Mobile app
on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/mobile.yml]
  pull_request:
    paths: [mobile/**, .github/workflows/mobile.yml]
  workflow_dispatch:
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  flutter:
    # Publishing the release needs write access; pull requests never get it.
    permissions:
      contents: write
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The fixed signing key lives in the GAMENIGHT_KEYSTORE_BASE64 and
      # GAMENIGHT_KEYSTORE_PASSWORD secrets; without them the APK gets a
      # throwaway debug key and cannot update an installed GameNight.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.GAMENIGHT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/gamenight.p12"
            echo "GAMENIGHT_KEYSTORE_FILE=$RUNNER_TEMP/gamenight.p12" >> "$GITHUB_ENV"
          fi
      # The run number is both the versionCode and the build the app compares
      # with version.json to offer updates.
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=GAMENIGHT_BUILD=${{ github.run_number }}
        env:
          GAMENIGHT_KEYSTORE_PASSWORD: ${{ secrets.GAMENIGHT_KEYSTORE_PASSWORD }}
      - name: Show the APK's signing fingerprint
        run: |
          {
            echo "### APK signing key"
            # v2/v3-signed APKs have no jar signature, so keytool cannot read them.
            "$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner" verify --print-certs \
              build/app/outputs/flutter-apk/app-release.apk | grep -E "certificate (DN|SHA-256)"
            [ -n "$GAMENIGHT_KEYSTORE_FILE" ] || echo "Debug key: set the GAMENIGHT_KEYSTORE_* secrets for a fixed one."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify hosted Android sign-in before publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.GAMENIGHT_KEYSTORE_FILE != ''
        run: |
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/apk-cert.txt"
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          from pathlib import Path
          cert = re.search(r"certificate SHA-256 digest: ([0-9a-fA-F]+)",
                           Path(os.environ["RUNNER_TEMP"], "apk-cert.txt").read_text()).group(1).upper()
          origin = "https://gamenight.ontola.io"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(origin + "/.well-known/assetlinks.json", timeout=15) as response:
                      entries = json.load(response)
                  matched = any(
                      entry.get("target", {}).get("package_name") == "io.ontola.gamenight"
                      and "delegate_permission/common.handle_all_urls" in entry.get("relation", [])
                      and cert in [f.replace(":", "").upper() for f in entry["target"].get("sha256_cert_fingerprints", [])]
                      for entry in entries)
                  if not matched:
                      raise RuntimeError("The website does not verify this APK's signing certificate")
                  with urllib.request.urlopen(origin + "/auth/app", timeout=15) as response:
                      if response.status != 200:
                          raise RuntimeError("App sign-in page is not deployed")
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  print("Waiting for matching hosted Android sign-in deployment", flush=True)
                  time.sleep(10)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      # One stable download link for the signed APK:
      # https://github.com/ontola/gamenight/releases/download/app-latest/gamenight.apk
      # Only a build signed with the fixed key is published, never a debug one.
      - name: Publish the APK as the app-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.GAMENIGHT_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk gamenight.apk
          git tag -f app-latest "$GITHUB_SHA"
          git push -f origin refs/tags/app-latest
          notes="Signed Android build of the GameNight app from commit ${GITHUB_SHA::7}. Install it over the previous one; the signing key stays the same."
          gh release view app-latest >/dev/null 2>&1 \
            || gh release create app-latest --title "GameNight for Android" --notes "$notes" --latest
          gh release edit app-latest --notes "$notes"
          echo "{\"build\":${{ github.run_number }},\"commit\":\"$GITHUB_SHA\"}" > version.json
          # The APK first: an app that sees the new version.json must find its APK.
          gh release upload app-latest gamenight.apk --clobber
          gh release upload app-latest version.json --clobber

  # Separate Play build: Google Play updates it, never our APK installer.
  play:
    needs: flutter
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: flutter pub get
      - run: flutter test --dart-define=GAMENIGHT_PLAY_STORE=true test/play_distribution_test.dart
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.GAMENIGHT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Google Play requires GAMENIGHT_KEYSTORE_BASE64 and GAMENIGHT_KEYSTORE_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/gamenight.p12"
          echo "GAMENIGHT_KEYSTORE_FILE=$RUNNER_TEMP/gamenight.p12" >> "$GITHUB_ENV"
      - name: Build signed Play App Bundle
        env:
          GAMENIGHT_KEYSTORE_PASSWORD: ${{ secrets.GAMENIGHT_KEYSTORE_PASSWORD }}
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=GAMENIGHT_BUILD=${{ github.run_number }} --dart-define=GAMENIGHT_PLAY_STORE=true
      - name: Verify Play manifest has no APK installer permission
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          manifests = list(Path('build/app/intermediates/merged_manifests').rglob('AndroidManifest.xml'))
          assert manifests, 'Merged release manifest was not found'
          for path in manifests:
              root = ET.parse(path).getroot()
              permissions = [p.get('{http://schemas.android.com/apk/res/android}name') for p in root.findall('uses-permission')]
              assert 'android.permission.REQUEST_INSTALL_PACKAGES' not in permissions, path
          print('Play bundle does not request APK installation permission.')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-play
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      # Upload the first bundle manually and activate internal testing before
      # setting this secret. A missing credential still leaves a signed artifact.
      - name: Upload to Google Play internal testing
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          python3 -m venv "$RUNNER_TEMP/play-venv"
          "$RUNNER_TEMP/play-venv/bin/pip" install --quiet 'google-api-python-client>=2,<3' 'google-auth>=2,<3'
          "$RUNNER_TEMP/play-venv/bin/python" android/publish_play.py build/app/outputs/bundle/release/app-release.aab ${{ github.run_number }}
      - name: First-time setup reminder
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo 'Signed Play bundle is in the gamenight-play artifact. Activate the first internal release, then set GOOGLE_PLAY_SERVICE_ACCOUNT_JSON to enable automatic uploads.' >> "$GITHUB_STEP_SUMMARY"

  # The iOS build goes to TestFlight once the APP_STORE_CONNECT_* secrets hold
  # an App Store Connect API key (Admin role); without them it only checks
  # that the app still builds for iOS, unsigned. macOS minutes are dear, so
  # this runs on main and by hand, not on pull requests.
  ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Build unsigned
        if: env.APP_STORE_CONNECT_PRIVATE_KEY == '' || github.ref != 'refs/heads/main'
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=GAMENIGHT_BUILD=${{ github.run_number }}
      - name: Create a certificate and profile for this run
        id: signing
        if: env.APP_STORE_CONNECT_PRIVATE_KEY != '' && github.ref == 'refs/heads/main'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'cryptography>=43'
          "$RUNNER_TEMP/venv/bin/python" ios/testflight.py prepare "$RUNNER_TEMP/ios-signing"
          cp "$RUNNER_TEMP/ios-signing/Signing.xcconfig" ios/Flutter/Signing.xcconfig
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/ios-signing/distribution.p12" -k "$keychain" -P "$(cat "$RUNNER_TEMP/ios-signing/p12-password")" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/ios-signing"/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build the signed IPA
        if: steps.signing.outcome == 'success'
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ios-signing/ExportOptions.plist" --build-number=${{ github.run_number }} --dart-define=GAMENIGHT_BUILD=${{ github.run_number }}
      - name: Upload to TestFlight
        if: steps.signing.outcome == 'success'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Build ${{ github.run_number }} is uploaded to TestFlight; it appears there once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke this run's certificate and profile
        if: always() && steps.signing.outcome != 'skipped'
        run: |
          "$RUNNER_TEMP/venv/bin/python" ios/testflight.py cleanup "$RUNNER_TEMP/ios-signing"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /app/ --pwa-strategy none --no-web-resources-cdn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify browser navigation, desktop layout and room continuity
        run: |
          npm install --prefix "$RUNNER_TEMP/player-browser" --no-save playwright@1.62.1
          export NODE_PATH="$RUNNER_TEMP/player-browser/node_modules"
          node "$NODE_PATH/playwright/cli.js" install --with-deps chromium
          GAMENIGHT_TEST_SCREENSHOTS="$RUNNER_TEMP/player-previews" node test/browser/loading.cjs
          GAMENIGHT_TEST_SCREENSHOTS="$RUNNER_TEMP/player-previews" node test/browser/navigation.cjs
          GAMENIGHT_TEST_SCREENSHOTS="$RUNNER_TEMP/player-previews" node test/browser/catalog-filters.cjs
          GAMENIGHT_TEST_SCREENSHOTS="$RUNNER_TEMP/player-previews" node test/browser/assistant.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-player-web
          path: mobile/build/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-browser-previews
          path: ${{ runner.temp }}/player-previews
