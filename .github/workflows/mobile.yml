name: Mobile app
on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/mobile.yml]
  pull_request:
    paths: [mobile/**, .github/workflows/mobile.yml]
  workflow_dispatch:
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  flutter:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The fixed signing key lives in the GAMENIGHT_KEYSTORE_BASE64 and
      # GAMENIGHT_KEYSTORE_PASSWORD secrets; without them the APK gets a
      # throwaway debug key and cannot update an installed GameNight.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.GAMENIGHT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/gamenight.p12"
            echo "GAMENIGHT_KEYSTORE_FILE=$RUNNER_TEMP/gamenight.p12" >> "$GITHUB_ENV"
          fi
      - run: flutter build apk --release
        env:
          GAMENIGHT_KEYSTORE_PASSWORD: ${{ secrets.GAMENIGHT_KEYSTORE_PASSWORD }}
      - name: Show the APK's signing fingerprint
        run: |
          {
            echo "### APK signing key"
            keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner|SHA256"
            [ -n "$GAMENIGHT_KEYSTORE_FILE" ] || echo "Debug key: set the GAMENIGHT_KEYSTORE_* secrets for a fixed one."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
