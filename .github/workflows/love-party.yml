name: LÖVE party pack
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  games:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      ALSOFT_DRIVERS: "null"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned game sources
        run: python scripts/fetch-game-sources.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install verified LÖVE runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'love.zip'
          Invoke-WebRequest 'https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369') { throw 'LÖVE checksum mismatch' }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'love')
      # Hosted Windows runners only expose OpenGL 1.1. Install Mesa beside
      # the test runtime, never in the game packages or desktop installer.
      - name: Install pinned software OpenGL for native window tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'DCB2719EF346DAB5B609FCB193A5F13CFC4B0502E3F4DE1AD43D349477402F47') { throw 'Mesa checksum mismatch' }
          & 7z x $archive "-o$env:RUNNER_TEMP/mesa" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          Copy-Item "$env:RUNNER_TEMP/mesa/x64/*.dll" "$env:RUNNER_TEMP/love/love-11.5-win64/"
      - name: Simulation and lifecycle tests
        shell: pwsh
        run: |
          $env:GNLOVE_HEADLESS = '1'
          $env:GNLOVE_TEST = '1'
          python scripts/test-love-simulation.py --love "$env:RUNNER_TEMP/love/love-11.5-win64/lovec.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Game tests failed' }
      - name: Package and verify deterministic output
        shell: pwsh
        run: |
          python scripts/package-love-party.py --output dist/party
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          python scripts/package-love-party.py --output dist/repeated
          if ($LASTEXITCODE -ne 0) { throw 'Repeat packaging failed' }
          if ((Get-FileHash dist/party/gamenight-love-party.zip).Hash -ne (Get-FileHash dist/repeated/gamenight-love-party.zip).Hash) { throw 'Non-deterministic package' }
          python scripts/test-love-party.py --love "$env:RUNNER_TEMP/love/love-11.5-win64/lovec.exe" --pack dist/party
          if ($LASTEXITCODE -ne 0) { throw 'Packaged settings/lifecycle tests failed' }
      - name: Fetch pinned SpaceRacer release and probe source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/native | Out-Null
          $entry = Get-Content catalog/games/spaceracer.json -Raw | ConvertFrom-Json
          $archive = 'dist/native/spaceracer-windows.zip'
          Invoke-WebRequest $entry.downloads.windows.url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.downloads.windows.sha256.ToLowerInvariant()) { throw 'SpaceRacer release checksum mismatch' }
          git clone --depth 1 --branch v0.4.1 https://github.com/joepio/spaceracer.git dist/native-source
          if ($LASTEXITCODE -ne 0) { throw 'SpaceRacer probe checkout failed' }
          if ((git -C dist/native-source rev-parse HEAD).Trim() -ne 'c5bb5eb9eb05a1a3dc3273453a5f1e49e36edfcb') { throw 'SpaceRacer probe source changed' }
      - name: Certify every packaged game against GameNight
        shell: pwsh
        run: |
          cargo build --locked -p gamenight-certify
          if ($LASTEXITCODE -ne 0) { throw 'Certifier build failed' }
          Remove-Item Env:GNLOVE_TEST -ErrorAction SilentlyContinue
          python scripts/game-contract.py --output dist/contract --pack dist/party --love "$env:RUNNER_TEMP/love/love-11.5-win64/lovec.exe" --certifier target/debug/gamenight-certify.exe --spaceracer-archive dist/native/spaceracer-windows.zip --spaceracer-source dist/native-source
          if ($LASTEXITCODE -ne 0) { throw 'Contract verification failed' }
      - name: Contract status summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist/contract/matrix.md) { Get-Content dist/contract/matrix.md | Add-Content $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-contract-windows
          path: dist/contract/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-love-party
          path: dist/party/*

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned game sources
        run: python scripts/fetch-game-sources.py
      - name: Install renderer with software OpenGL
        run: sudo apt-get update && sudo apt-get install -y love xvfb libgl1-mesa-dri
      - run: python3 scripts/package-love-party.py --output dist/party
      - name: Render every packaged game
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 scripts/test-love-party-render.py --love /usr/bin/love --pack dist/party

  gate:
    needs: [games, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game-contract-windows
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: gamenight-love-party
          path: games
      # This workflow certifies the new source build, not the older catalog
      # downloads. The installer release job separately runs the strict --gate.
      - name: Verify portable evidence and exact candidate packages
        run: python scripts/game-contract.py --candidate-gate --platform windows --output evidence --pack games
