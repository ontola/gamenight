name: LÖVE party pack
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  games:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install verified LÖVE runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'love.zip'
          Invoke-WebRequest 'https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369') { throw 'LÖVE checksum mismatch' }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'love')
      - name: Simulation and lifecycle tests
        shell: pwsh
        run: |
          $env:GNLOVE_HEADLESS = '1'
          $env:GNLOVE_TEST = '1'
          & "$env:RUNNER_TEMP/love/love-11.5-win64/lovec.exe" games/love-party
          if ($LASTEXITCODE -ne 0) { throw 'Game tests failed' }
      - name: Package and verify deterministic output
        shell: pwsh
        run: |
          python scripts/package-love-party.py --output dist/party
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          python scripts/package-love-party.py --output dist/repeated
          if ($LASTEXITCODE -ne 0) { throw 'Repeat packaging failed' }
          if ((Get-FileHash dist/party/gamenight-love-party.zip).Hash -ne (Get-FileHash dist/repeated/gamenight-love-party.zip).Hash) { throw 'Non-deterministic package' }
      - name: Certify every packaged game against GameNight
        shell: pwsh
        run: |
          cargo build --locked -p gamenight-certify
          if ($LASTEXITCODE -ne 0) { throw 'Certifier build failed' }
          Remove-Item Env:GNLOVE_TEST -ErrorAction SilentlyContinue
          python scripts/game-contract.py --output dist/contract --pack dist/party --love "$env:RUNNER_TEMP/love/love-11.5-win64/lovec.exe" --certifier target/debug/gamenight-certify.exe
          if ($LASTEXITCODE -ne 0) { throw 'Contract verification failed' }
      - name: Contract status summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist/contract/matrix.md) { Get-Content dist/contract/matrix.md | Add-Content $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-contract-windows
          path: dist/contract/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gamenight-love-party
          path: dist/party/*

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer with software OpenGL
        run: sudo apt-get update && sudo apt-get install -y love xvfb libgl1-mesa-dri
      - run: python3 scripts/package-love-party.py --output dist/party
      - name: Render every packaged game
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 scripts/test-love-party-render.py --love /usr/bin/love --pack dist/party
