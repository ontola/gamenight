<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · GameNight</title><link rel="icon" href="/web/icon.svg"><link rel="stylesheet" href="/web/account.css"><link rel="stylesheet" href="/web/site.css"><script src="/auth/email.js" defer></script></head>
<body class="account-page"><div id="site-shell"></div><script src="/web/shell.js" defer></script><main class="login-shell">
<section class="login-panel"><span class="eyebrow">LET’S PLAY</span><h1>Your next game starts here.</h1><p>One email. Your player, wherever you play.</p>
<form id="email-form"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" maxlength="254" required autofocus><button type="submit">Continue with email <span aria-hidden="true">→</span></button><p class="hint">New here? This creates your account too. No password needed.</p></form>
<form id="code-form" hidden><label for="code">Enter your sign-in code</label><p id="destination"></p><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" placeholder="00000000" required><button type="submit">Let’s play <span aria-hidden="true">→</span></button><div class="login-actions"><button id="resend" type="button" class="quiet">Send a new code</button><button id="change" type="button" class="quiet">Change email</button></div><p class="hint">Your code works once and expires in 10 minutes.</p></form>
<p id="status" role="status" aria-live="polite"></p></section><p class="login-footer">Make yourself at home.</p></main></body></html>
