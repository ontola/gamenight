<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameNight · Your player</title><link rel="icon" href="/web/icon.svg"><link rel="stylesheet" href="/web/account.css"><link rel="stylesheet" href="/web/site.css"><body class="account-page"><div id="site-shell"></div><script src="/web/shell.js" defer></script><main><h1>Make yourself at home.</h1><p id="status" role="status">Connecting…</p><a class="button" id="login" href="/auth/login" hidden>Sign in</a><section id="account" hidden><form id="profile"><label>Player name<input id="name" maxlength="40" required autocomplete="nickname"></label><label>Skin colour<input id="skin" type="color"></label><button>Save profile</button></form><section><h2>Your artwork</h2><p><a class="button" href="/studio">Open character editor</a></p><p>Your drawing tools, character preview and saved faces.</p><label class="button">Import profile<input id="import" type="file" accept="application/json,.json"></label><button id="export">Export profile</button></section><section><h2>Discovery</h2><label><input id="personalization" type="checkbox"> Remember my game preferences</label><p>Turning this off clears your preference vector.</p></section><footer><button id="logout">Sign out</button><button id="delete">Delete account</button></footer></section></main><script src="/account.js" defer></script></html>
