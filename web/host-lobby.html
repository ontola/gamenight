<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lobby · GameNight</title><link rel="stylesheet" href="/web/site.css"><style>body{margin:0;background:#0e1020;color:#f1f0fa;font:18px system-ui}main{max-width:680px;margin:8vh auto;padding:24px}button,select{font:inherit;padding:14px 20px;border-radius:12px;border:1px solid #54506b;background:#252339;color:inherit;margin:8px 8px 8px 0}button:hover{background:#473c78}button:focus-visible,select:focus-visible{outline:3px solid #a991ff}h1{font-size:36px}p{line-height:1.5}label{display:block}a{color:#b8a6ff}#status{min-height:2em}</style><main><a href="/">GameNight</a><section id="recovery" hidden><h1>Your lobby closed</h1><p>Your party is still here. Try the lobby again, or return to your paused game.</p><button data-action="retry">Retry lobby</button><button data-action="resume">Resume game</button><button data-action="quit">End game night</button></section><section><h1>Choose your lobby</h1><p>Use the bundled lobby or an installed replacement. Changes apply the next time you open GameNight.</p><label for="choice">Lobby</label><select id="choice"></select><button id="save">Save</button></section><p id="status" role="status"></p></main><script>
const status=document.querySelector('#status'), choice=document.querySelector('#choice');
document.querySelector('#recovery').hidden=!new URLSearchParams(location.search).has('recovery');
async function send(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-GameNight-Host':'1'},body:JSON.stringify(data)});if(!r.ok)throw Error('Could not apply that change. Try again.');}
fetch('/api/host/lobby').then(async r=>{if(!r.ok)throw Error('Lobby selection is available when launched from the installed app.');const data=await r.json();for(const item of data.choices){const o=new Option(item.title,item.id);o.selected=item.id===data.selected;choice.add(o);}}).catch(e=>{status.textContent=e.message;document.querySelector('#save').disabled=true;});
document.querySelector('#save').onclick=async()=>{try{await send('/api/host/lobby',{id:choice.value});status.textContent='Saved. Restart GameNight to use this lobby.';}catch(e){status.textContent=e.message;}};
for(const button of document.querySelectorAll('[data-action]'))button.onclick=async()=>{if(button.dataset.action==='quit'&&!confirm('End game night for everyone?'))return;try{await send('/api/host/recovery',{action:button.dataset.action});status.textContent=button.dataset.action==='retry'?'Restarting your lobby…':button.dataset.action==='resume'?'Returning to your game…':'Game night ended.';}catch(e){status.textContent=e.message;}};
</script></html>
